[tools]

# Runtimes for npm/pipx-backed tools (prettier, markdownlint-cli2,
# yamllint).
# renovate: datasource=node-version depName=node
node = "24.14.0"
# renovate: datasource=github-tags depName=python/cpython extractVersion=^v(?<version>.*)$
python = "3.13.12"
# renovate: datasource=github-releases depName=astral-sh/uv
uv = "0.10.11"

# Repo utilities
# renovate: datasource=github-releases depName=casey/just
just = "1.58.0"
# renovate: datasource=github-releases depName=cli/cli
gh = "2.102.0"
# renovate: datasource=github-releases depName=donaldgifford/docz
"github:donaldgifford/docz" = "2.6.1"
# renovate: datasource=github-releases depName=orhun/git-cliff
git-cliff = "latest"

# Formatters and linters
# renovate: datasource=github-releases depName=DavidAnson/markdownlint-cli2
markdownlint-cli2 = "0.18.1"
# renovate: datasource=github-releases depName=google/yamlfmt
yamlfmt = "0.21.0"
# renovate: datasource=github-tags depName=adrienverge/yamllint
yamllint = "1.38.0"
# renovate: datasource=npm depName=prettier
prettier = "3.9.6"
# renovate: datasource=github-releases depName=rhysd/actionlint
actionlint = "latest"
# renovate: datasource=github-releases depName=koalaman/shellcheck
shellcheck = "latest"
shfmt = "latest"

# Extension tooling
# renovate: datasource=npm depName=web-ext
"npm:web-ext" = "10.8.0"

# Security
# renovate: datasource=github-releases depName=trufflesecurity/trufflehog
trufflehog = "3.96.0"
