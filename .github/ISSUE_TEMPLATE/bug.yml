---
name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AWS console containers
        - AWS access portal containers
        - Okta admin containers
        - Options and naming
        - CI / release
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: >-
        What you clicked or opened, in which kind of tab. Do not include real
        account IDs, tenant names, tokens or cookies.
      placeholder: |
        1. Opened the access portal in a tab with no container
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Version
      description: Extension version or commit, and Firefox version
    validations:
      required: false
