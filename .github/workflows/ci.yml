---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  labeler:
    name: Label PR
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v6

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Lint
        run: just lint

      - name: Validate docs
        run: just docs-validate

  extension:
    name: Extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Type-check
        run: just typecheck

      - name: Unit tests
        run: just test

      - name: Lint JavaScript
        run: just js-lint

      - name: Source checks
        run: just source-check

      - name: Manifest check
        run: just manifest-check

      - name: Lint extension
        run: just ext-lint
