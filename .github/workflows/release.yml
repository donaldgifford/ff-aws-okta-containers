---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Release

# On merge to main:
#   bump-version — semver bump + tag derived from the merged PR's label
#                  (major/minor/patch/dont-release, created by labels.sh)
#   release      — GitHub Release for the new tag
#
# A PR labeled `dont-release` produces no tag, so nothing is released.
# Packaging and signing the extension are added to the release job once
# the extension exists.
on:
  push:
    branches: [main]

# contents: write — bump-version pushes the release tag and the release
# job creates the GitHub Release.
permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.version }}
      skipped: ${{ steps.bump.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jefflinse/pr-semver-bump@v1.7.4
        id: bump
        name: Bump and Tag Version
        with:
          mode: bump
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          require-release-notes: false
          major-label: major
          minor-label: minor
          patch-label: patch
          noop-labels: "dont-release"
          release-notes-prefix: "### RELEASE NOTES"
          with-v: true

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: bump-version
    if: needs.bump-version.outputs.tag != '' && needs.bump-version.outputs.skipped != 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump-version.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
