---
# yaml-language-server: $schema=https://www.schemastore.org/dependabot-2.0.json
# Security-updates-only mode. Renovate owns routine version bumps;
# Dependabot's only job here is the GitHub Advisory feed.
#
# `open-pull-requests-limit: 0` is the documented switch that disables
# version updates while keeping security updates enabled:
# https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/configuring-dependabot-security-updates#overriding-the-default-behavior-with-a-configuration-file
#
# Add an `npm` entry once the extension has a package.json.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - security
      - dependencies
    assignees:
      - donaldgifford
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
